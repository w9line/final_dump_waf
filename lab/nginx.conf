worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /tmp/nginx-access.log;
  server {
    listen 8080;
    server_tokens off;
    location = /nginx_status {
      stub_status;
      access_log off;
    }
    location / {
      add_header X-Aegis-Backend nginx always;
      default_type text/plain;
      return 200 "nginx-ok\n";
    }
  }
}
